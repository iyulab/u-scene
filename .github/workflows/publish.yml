name: Publish to npm
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # Any package.json edit triggers this workflow; only a version not yet on npm is published.
      - name: Skip when this version is already published
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view "@iyulab/u-scene@${version}" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "@iyulab/u-scene@${version} is already on npm - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.publish == 'true'
        run: pnpm build
      - if: steps.version.outputs.publish == 'true'
        run: pnpm publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
